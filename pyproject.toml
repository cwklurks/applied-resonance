[project]
name = "earsight"
version = "0.1.0"
description = "Phase 0 MIMII acoustic-anomaly-detection baseline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "requests>=2.31",
    "tqdm>=4.66",
    "torchlibrosa>=0.1.0",
    "sounddevice>=0.4.6",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.36",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
